name: Portable exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Ikonlari uret
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\Scripts\RegenerateAppIcon.ps1

      - name: Portable exe yayinla (64 bit)
        run: >
          dotnet publish DirectoryManagement.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:AssemblyName=DirectoryManagement-x64
          -o publish/win-x64

      - name: Portable exe yayinla (32 bit)
        run: >
          dotnet publish DirectoryManagement.csproj
          -c Release -r win-x86 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:AssemblyName=DirectoryManagement-x86
          -o publish/win-x86

      - uses: actions/upload-artifact@v5
        with:
          name: DirectoryManagement-x64
          path: publish/win-x64/DirectoryManagement-x64.exe

      - uses: actions/upload-artifact@v5
        with:
          name: DirectoryManagement-x86
          path: publish/win-x86/DirectoryManagement-x86.exe

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            publish/win-x64/DirectoryManagement-x64.exe
            publish/win-x86/DirectoryManagement-x86.exe
