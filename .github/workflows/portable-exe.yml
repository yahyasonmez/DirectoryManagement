name: Portable exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Ikonlari uret
        shell: pwsh
        run: ./Scripts/RegenerateAppIcon.ps1

      - name: Portable exe yayinla
        run: >
          dotnet publish DirectoryManagement.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: DirectoryManagement-win-x64
          path: publish/win-x64/DirectoryManagement.exe

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/DirectoryManagement.exe
